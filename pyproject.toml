[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvf"
version = "1.0.0"
description = "Customer purchase propensity and 90-day revenue forecasting from transactional data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "scipy>=1.11",
    "tabulate>=0.9",
    "typer>=0.12",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
cvf = "cvf.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
